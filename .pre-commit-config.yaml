fail_fast: true
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
    - id: check-added-large-files
      args: [ --maxkb=8192 ]
    - id: fix-byte-order-marker
    - id: check-case-conflict
    - id: check-json
    - id: check-yaml
      args: [ --unsafe ]
    - id: detect-aws-credentials
      args: [ --allow-missing-credentials ]
    - id: detect-private-key
    - id: end-of-file-fixer
      # Eval goldens and cassettes are machine-written JSON (no trailing newline).
      exclude: ^evals/.*\.json$
    - id: trailing-whitespace
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.6
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    # Run the formatter.
    - id: ruff-format
- repo: https://github.com/pre-commit/mirrors-mypy
  rev: v2.3.1
  hooks:
    - id: mypy
- repo: local
  hooks:
  - id: pytest
    name: pytest [with coverage, without slow]
    entry: bash -ec "uv run python -m pytest --cov=pdfalive --cov-fail-under='85' pdfalive/tests -m 'not slow'"
    language: system
    types: [python]
    pass_filenames: false
