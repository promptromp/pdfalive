[build-system]
requires = ["setuptools>=80", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "pdfalive"
description = "A Python library and CLI tool that uses LLMs to enhance PDF files"
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]
authors = [{ name = "Adam Ever-Hadani" }]
keywords = ["pdf", "llm", "toc", "bookmarks", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: General",
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8.4.1",
    "langchain>=1.3.4",
    "langchain-anthropic>=1.4.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.2.2",
    "langsmith>=0.8.9",
    "ollama",
    "pydantic>=2.13.4",
    "pymupdf>=1.27.2.3",
    "tenacity>=9.1.4",
    "rich>=15.0.0",
    "tiktoken>=0.13.0",
    "urllib3>=2.7.0",
]
dynamic = ["version"]

[dependency-groups]
dev = [
    "devtools>=0.12.2",
    "ipython>=9.14.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.15",
]

[project.scripts]
pdfalive = "pdfalive.cli:cli"

[tool.setuptools.packages.find]
include = ["pdfalive*"]

[tool.setuptools_scm]
# can be empty if no extra settings are needed, presence enables setuptools-scm

[tool.mypy]
ignore_missing_imports = true

# pymupdf's type stubs are incomplete (Document not iterable, Page attributes
# missing, etc.). Skip importing the module so mypy treats it as untyped,
# falling back to Any for all pymupdf types.
[[tool.mypy.overrides]]
module = "pymupdf.*"
follow_imports = "skip"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Pylint (Convention)
    "PLC",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pdfalive"]
lines-after-imports = 2
no-lines-before = ["standard-library"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "slow: marks tests that make real LLM/network calls (deselect with '-m \"not slow\"')",
]
filterwarnings = [
    # Ignore SWIG-related deprecation warnings from PyMuPDF (Python 3.13 compatibility issue)
    "ignore:builtin type Swig.*:DeprecationWarning",
    "ignore:builtin type swigvarlink.*:DeprecationWarning",
]
